<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-hover: #7C3AED;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --danger: #EF4444;
      --success: #10B981;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    h3 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-logo {
      background: linear-gradient(135deg, var(--primary), #EC4899);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }

    .status-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .label {
      color: var(--text-muted);
      font-size: 13px;
    }

    .value {
      font-weight: 500;
      font-size: 13px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .status-inactive {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .status-active {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
      animation: pulse 2s infinite;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background-color: transparent;
      border: 1px solid #475569;
      color: var(--text);
    }

    button.secondary:hover {
      background-color: #334155;
      border-color: #64748B;
    }

    button.danger {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }

    button.danger:hover {
      background-color: rgba(239, 68, 68, 0.2);
    }

    .tip {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
      line-height: 1.4;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h3>
    <span class="badge-logo">M</span>
    Marvedge Action Capture
  </h3>

  <div class="status-card">
    <div class="status-row">
      <span class="label">Status:</span>
      <span id="status-badge" class="status-indicator status-inactive">Inactive</span>
    </div>
    <div class="status-row">
      <span class="label">Demo ID:</span>
      <span id="demo-id" class="value">-</span>
    </div>
    <div class="status-row">
      <span class="label">Clicks Captured:</span>
      <span id="click-count" class="value">0</span>
    </div>
  </div>

  <button id="download-btn">📥 Download Event Log (.json)</button>
  <button id="clear-btn" class="secondary danger">🧹 Clear Session Data</button>

  <p class="tip">
    Keep the Marvedge Recorder tab open to automatically stream and sync click-zoom events as they occur.
  </p>

  <script src="popup.js"></script>
</body>
</html>
